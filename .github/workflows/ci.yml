name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  spm-tests:
    name: SPM tests (macOS)
    # macos-26 runner image gives us Xcode 26 + Swift 6.2 matching
    # the local toolchain. The previous macos-15 + Xcode_16 pinning
    # was running ~1 major version behind the source, which caused
    # silent build breaks whenever a commit used a Swift 6.2-only
    # API or main-actor isolation behavior.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [WritCore, WritParser, WritRender]
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # The macos-26 runner image installs multiple Xcode versions
        # under /Applications. We want the newest 26.x; fall back to
        # the default symlink if no explicit 26.x path is present.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          candidate=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$candidate" ]; then candidate=/Applications/Xcode.app; fi
          echo "Using $candidate"
          sudo xcode-select -s "$candidate"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            Packages/${{ matrix.package }}/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package), format('Packages/{0}/Package.resolved', matrix.package)) }}

      - name: Run tests
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app-build:
    name: Build Writ.app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # The macos-26 runner image installs multiple Xcode versions
        # under /Applications. We want the newest 26.x; fall back to
        # the default symlink if no explicit 26.x path is present.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          candidate=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$candidate" ]; then candidate=/Applications/Xcode.app; fi
          echo "Using $candidate"
          sudo xcode-select -s "$candidate"

      - name: Install xcodegen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check the Xcode project is still committed
        # Writ.xcodeproj is generated from project.yml AND committed, because
        # Xcode Cloud validates the repository before running any hook and
        # refuses one whose project is not at the root ("Project Writ.xcodeproj
        # does not exist at the root of the repository", exit 66). Since
        # nothing else in the repo needs the file, it is exactly the kind of
        # thing a later tidy-up deletes as redundant — and the breakage would
        # surface in Xcode Cloud, not here. So assert it is tracked.
        #
        # Deliberately NOT a check that the committed project matches a fresh
        # `xcodegen generate`. That was tried and reverted: objectVersion and
        # preferredProjectObjectVersion are derived from the *installed Xcode*,
        # so the generated bytes differ between a 27.2 laptop and a 26.6
        # runner, and byte-equality is unattainable rather than merely
        # awkward. It would also be guarding nothing: every build path
        # (make-release.sh, appstore-release.sh, ci_post_clone.sh, and the step
        # above) runs `xcodegen generate` first, so no build ever reads the
        # committed project's contents. Only its existence matters.
        run: |
          if ! git ls-files --error-unmatch Writ.xcodeproj/project.pbxproj >/dev/null 2>&1; then
            echo "::error::Writ.xcodeproj/project.pbxproj is not tracked by git. Xcode Cloud requires it (see docs/07-APP-STORE.md §7)."
            exit 1
          fi
          echo "Xcode project is committed."

      - name: Build (Debug, ad-hoc signed)
        # `xcbeautify --renderer github-actions` formats xcodebuild
        # output for the GitHub Actions log AND surfaces diagnostics
        # as annotations on the run. set -o pipefail propagates the
        # xcodebuild exit code through the pipe so a failure here
        # actually fails the job.
        run: |
          set -o pipefail
          xcodebuild \
            -project Writ.xcodeproj \
            -scheme Writ \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions
