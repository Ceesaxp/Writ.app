name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  spm-tests:
    name: SPM tests (macOS)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [WritCore, WritParser, WritRender]
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            Packages/${{ matrix.package }}/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package), format('Packages/{0}/Package.resolved', matrix.package)) }}

      - name: Run tests
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app-build:
    name: Build Writ.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Debug, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project Writ.xcodeproj \
            -scheme Writ \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -50
