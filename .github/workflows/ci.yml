name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  spm-tests:
    name: SPM tests (macOS)
    # macos-26 runner image gives us Xcode 26 + Swift 6.2 matching
    # the local toolchain. The previous macos-15 + Xcode_16 pinning
    # was running ~1 major version behind the source, which caused
    # silent build breaks whenever a commit used a Swift 6.2-only
    # API or main-actor isolation behavior.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [WritCore, WritParser, WritRender]
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # The macos-26 runner image installs multiple Xcode versions
        # under /Applications. We want the newest 26.x; fall back to
        # the default symlink if no explicit 26.x path is present.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          candidate=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$candidate" ]; then candidate=/Applications/Xcode.app; fi
          echo "Using $candidate"
          sudo xcode-select -s "$candidate"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            Packages/${{ matrix.package }}/.build
            Packages/${{ matrix.package }}/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ matrix.package }}-${{ hashFiles(format('Packages/{0}/Package.swift', matrix.package), format('Packages/{0}/Package.resolved', matrix.package)) }}

      - name: Run tests
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app-build:
    name: Build Writ.app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        # The macos-26 runner image installs multiple Xcode versions
        # under /Applications. We want the newest 26.x; fall back to
        # the default symlink if no explicit 26.x path is present.
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          candidate=$(ls -1d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$candidate" ]; then candidate=/Applications/Xcode.app; fi
          echo "Using $candidate"
          sudo xcode-select -s "$candidate"

      - name: Install xcodegen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check the committed project matches project.yml
        # Writ.xcodeproj is generated, and is also committed, because Xcode
        # Cloud rejects a repository without the project at its root. A
        # committed generated file can go stale, and when Gridka's did, it
        # uploaded the wrong version and App Store Connect closed that train
        # (Gridka f8e3203). The previous step just regenerated the project
        # from project.yml, so any diff here means the committed copy no
        # longer matches its source — fail now, in a pull request, rather
        # than at upload time.
        #
        # Defence in depth rather than the primary guard: every build path
        # (make-release.sh, appstore-release.sh, ci_post_clone.sh, this job)
        # runs `xcodegen generate` first, so a stale committed project cannot
        # actually reach a build. What this keeps honest is the repository.
        #
        # One way it can fail without anyone having done anything wrong: the
        # step above installs XcodeGen unpinned, so a release that changes its
        # output will make the committed project differ from a fresh generate.
        # The fix is the same either way — regenerate locally and commit.
        run: |
          if ! git diff --quiet -- Writ.xcodeproj; then
            echo "::error::Writ.xcodeproj is out of date. Run 'xcodegen generate' and commit the result."
            git diff --stat -- Writ.xcodeproj
            exit 1
          fi
          echo "Committed project matches project.yml."

      - name: Build (Debug, ad-hoc signed)
        # `xcbeautify --renderer github-actions` formats xcodebuild
        # output for the GitHub Actions log AND surfaces diagnostics
        # as annotations on the run. set -o pipefail propagates the
        # xcodebuild exit code through the pipe so a failure here
        # actually fails the job.
        run: |
          set -o pipefail
          xcodebuild \
            -project Writ.xcodeproj \
            -scheme Writ \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | xcbeautify --renderer github-actions
