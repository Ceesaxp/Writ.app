name: Writ
options:
  bundleIdPrefix: org.ceesaxp
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.4.7"
    CURRENT_PROJECT_VERSION: "18"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: Q34D9AYJ95
    PRODUCT_NAME: Writ
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      # Aligned with Gridka — Automatic style lets the toolchain pick the
      # matching Developer ID certificate based on DEVELOPMENT_TEAM, so
      # cert renewals don't break the build.
      CODE_SIGN_STYLE: Automatic
packages:
  WritCore:
    path: Packages/WritCore
  WritParser:
    path: Packages/WritParser
  WritRender:
    path: Packages/WritRender
targets:
  Writ:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: Resources/preview
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Writ
        CFBundleName: Writ
        CFBundleIdentifier: org.ceesaxp.Writ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Andrei Popov"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        NSMainStoryboardFile: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - net.daringfireball.markdown
              - org.commonmark.markdown
              - public.markdown
            LSTypeIsPackage: false
            NSDocumentClass: $(PRODUCT_MODULE_NAME).WritDocument
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
            LSTypeIsPackage: false
            NSDocumentClass: $(PRODUCT_MODULE_NAME).WritDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
              public.mime-type:
                - text/markdown
    entitlements:
      path: App/Writ.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # WKWebView's WebContent process needs this even for file://
        # loads from the app bundle — macOS 26 tightened the sandbox
        # so WebContent can't initialise without it, leaving the
        # webview stuck at about:blank with no didFinish/didFail.
        com.apple.security.network.client: true
    dependencies:
      - package: WritCore
      - package: WritParser
      - package: WritRender
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
