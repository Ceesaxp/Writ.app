name: Writ
options:
  bundleIdPrefix: org.ceesaxp
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "33"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: Q34D9AYJ95
    PRODUCT_NAME: Writ
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    Release:
      # Aligned with Gridka — Automatic style lets the toolchain pick the
      # matching Developer ID certificate based on DEVELOPMENT_TEAM, so
      # cert renewals don't break the build.
      CODE_SIGN_STYLE: Automatic
packages:
  WritCore:
    path: Packages/WritCore
  WritParser:
    path: Packages/WritParser
  WritRender:
    path: Packages/WritRender
targets:
  Writ:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      # Apple's privacy manifest. Copied into the bundle as
      # Contents/Resources/PrivacyInfo.xcprivacy, where App Store Connect
      # looks for it at upload.
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/preview
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Writ
        CFBundleName: Writ
        CFBundleIdentifier: org.ceesaxp.Writ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Andrei Popov"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        NSMainStoryboardFile: ""
        # --- Mac App Store submission ---
        # Required: App Store Connect refuses the upload outright if the
        # category is missing. Writ is a Markdown editor, so "productivity";
        # Gridka's "utilities" would be wrong here.
        LSApplicationCategoryType: public.app-category.productivity
        # actool already injects this from ASSETCATALOG_COMPILER_APPICON_NAME,
        # but the App Store requires it, so declare it rather than depend on a
        # build-tool side effect.
        CFBundleIconName: AppIcon
        # Writ uses no encryption beyond what macOS itself provides. Declaring
        # that here skips the export-compliance questionnaire on every single
        # submission. Must be a real boolean — the string "false" is ignored.
        ITSAppUsesNonExemptEncryption: false
        # Shown the first time Writ reaches a diagram server on the local
        # network, which is only ever one the user pointed it at themselves.
        NSLocalNetworkUsageDescription: "Writ connects to the PlantUML or Kroki server you configure in Settings to render diagrams from your document."
        # Scoped to local networking only: this permits cleartext HTTP to
        # localhost and `.local` hosts, which a self-hosted PlantUML server
        # or Kroki instance normally is, WITHOUT allowing arbitrary
        # cleartext HTTP to the internet. Deliberately not
        # NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - net.daringfireball.markdown
              - org.commonmark.markdown
              - public.markdown
            LSTypeIsPackage: false
            NSDocumentClass: $(PRODUCT_MODULE_NAME).WritDocument
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.text
            LSTypeIsPackage: false
            NSDocumentClass: $(PRODUCT_MODULE_NAME).WritDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
              public.mime-type:
                - text/markdown
    entitlements:
      path: App/Writ.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # WKWebView's WebContent process needs this even for file://
        # loads from the app bundle — macOS 26 tightened the sandbox
        # so WebContent can't initialise without it, leaving the
        # webview stuck at about:blank with no didFinish/didFail.
        com.apple.security.network.client: true
    dependencies:
      - package: WritCore
      - package: WritParser
      - package: WritRender
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
  # Hostless unit-test bundle. Deliberately has no test host and no
  # dependency on the Writ app target: launching the app would run
  # `applicationDidFinishLaunching` → `NSDocumentController.newDocument`,
  # spinning up a document window and a WKWebView. The production sources
  # under test are compiled straight into the bundle instead.
  WritTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        # The project-wide base sets PRODUCT_NAME: Writ, which would name the
        # bundle Writ.xctest and give it the module name `Writ`.
        PRODUCT_NAME: WritTests
    sources:
      - path: App/Tests
      - path: App/Sources/App/SplitFractionStore.swift
      - path: App/Sources/Editor/BlockSelection.swift
      - path: App/Sources/Editor/WritTextView.swift
      - path: App/Sources/Editor/LatencyProbe.swift
      - path: App/Sources/Preview/PrintCompletionHandler.swift
      - path: App/Sources/Preview/OneShotWait.swift
      - path: App/Sources/Preview/PlantUMLSettings.swift
    dependencies:
      - package: WritParser
      # PlantUMLSettings gates on FrontMatter (WritParser) and
      # TechnicalBlock (WritCore), so the test bundle needs both.
      - package: WritCore

# Shared schemes, declared rather than left to autocreation.
#
# With no `schemes:` block XcodeGen emits no scheme at all, and xcodebuild
# and Xcode each quietly autocreate one per target into `xcuserdata/` —
# per-developer, never in the repository. That is why `-scheme Writ` has
# always worked locally despite `Writ.xcodeproj/xcshareddata/xcschemes/`
# not existing. It leaves two things to chance that matter once a machine
# other than this one does the archiving: whether any scheme exists in a
# fresh clone, and which configuration the archive action picks. Both are
# pinned here.
schemes:
  Writ:
    build:
      targets:
        Writ: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WritTests
    profile:
      config: Release
    analyze:
      config: Debug
    # The App Store and DMG scripts both pass `-configuration Release`
    # explicitly; this makes an archive started from Xcode or Xcode Cloud,
    # which pass no configuration at all, agree with them.
    archive:
      config: Release
  WritTests:
    build:
      targets:
        WritTests: [test]
    test:
      config: Debug
      targets:
        - WritTests
