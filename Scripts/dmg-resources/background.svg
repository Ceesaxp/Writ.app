<?xml version="1.0" encoding="UTF-8"?>
<!-- 600×420 background for the Writ installer DMG.
     Icon positions set by AppleScript in make-release.sh must
     match these visual anchors:
       Writ.app          (160, 200)
       Applications      (440, 200)
       README.rtf        (300, 340)   ← clear of all background text -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafb"/>
      <stop offset="100%" stop-color="#eceef2"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="600" height="420" fill="url(#bg)"/>

  <!-- Dark banner across the top -->
  <rect x="0" y="0" width="600" height="64" fill="url(#banner)"/>
  <text x="300" y="42" font-family="-apple-system, system-ui, sans-serif"
        font-size="24" font-weight="600" fill="#f8fafc" text-anchor="middle">Writ</text>

  <!-- Subtle drop-zone indicators behind the two icons. The icons
       themselves are placed by Finder over these positions. -->
  <circle cx="160" cy="200" r="64" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="440" cy="200" r="64" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Arrow from Writ.app → Applications -->
  <g stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="234" y1="200" x2="358" y2="200"/>
    <polyline points="343,186 358,200 343,214"/>
  </g>

  <!-- One-line caption below the icons (icon labels sit at ~y=250) -->
  <text x="300" y="290" font-family="-apple-system, system-ui, sans-serif"
        font-size="13" font-weight="500" fill="#475569" text-anchor="middle">Drag Writ to Applications</text>
</svg>
